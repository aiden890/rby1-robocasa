[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rby1-robocasa-client"
version = "0.1.0"
description = "Client for the RB-Y1 RoboCasa sim server (robo-synapse device contracts)"
requires-python = ">=3.10"
dependencies = ["numpy", "pyzmq", "msgpack", "msgpack-numpy"]

[tool.setuptools]
packages = ["rby1_robocasa_client"]
